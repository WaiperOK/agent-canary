[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-canary"
version = "0.2.0"
description = "Measure whether an AI coding agent obeys instructions planted in a repository (prompt injection canary tests)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []
keywords = ["ai-security", "prompt-injection", "llm-security", "coding-agents", "red-team", "canary"]

[project.scripts]
agent-canary = "agent_canary.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
