name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run tests
        run: PYTHONPATH=src python -m unittest discover -s tests -v
      - name: CLI smoke check
        run: |
          PYTHONPATH=src python -m agent_canary channels
          PYTHONPATH=src python -m agent_canary run --cmd "python $PWD/examples/fake_agents/fake_agent.py ignorant" --runs 1 --quiet
